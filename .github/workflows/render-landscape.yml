name: Render Landscape

on:
  push:
    paths:
      - "llm_circuit_agent_landscape/data/**"
      - "llm_circuit_agent_landscape/scripts/**"
      - "llm_circuit_agent_landscape/requirements.txt"
      - "llm_circuit_agent_landscape/Makefile"
      - ".github/workflows/render-landscape.yml"
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: llm_circuit_agent_landscape
      - name: Validate and sync Mermaid to README
        run: make all
        working-directory: llm_circuit_agent_landscape
      - name: Check README is in sync
        run: git diff --exit-code README.md
      - uses: actions/upload-artifact@v4
        with:
          name: landscape-mermaid
          path: |
            llm_circuit_agent_landscape/figures/*.mmd
            README.md
